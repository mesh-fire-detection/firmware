[platformio]
test_dir = tests
src_dir = ../../src

[env:mfd-notecard-test]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
build_src_filter =
    -<*>
    +<notecard/Gateway.cpp>
    +<mesh/generated/meshtastic/*.pb.cpp>
    -<mesh/generated/meshtastic/deviceonly.pb.cpp>
build_flags =
    -std=c++17
    -I../../src
    -I../../src/mesh/generated
    -DPB_ENABLE_MALLOC=1
lib_deps =
    https://github.com/nanopb/nanopb/archive/refs/tags/nanopb-0.4.9.1.zip
    https://github.com/Erriez/ErriezCRC32/archive/refs/tags/1.0.1.zip
